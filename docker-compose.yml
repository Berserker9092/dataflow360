services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: dataflow
      POSTGRES_PASSWORD: dataflow2026
      POSTGRES_DB: dataflow360
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  postgres_data:
  mongo_data: