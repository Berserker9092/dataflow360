services:
  postgres:
    image: pgvector/pgvector:pg16
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Initialisation automatique (ordre alphabétique)
      - ./src/storage/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./src/storage/migrations.sql:/docker-entrypoint-initdb.d/02-migrations.sql:ro
      - ./src/storage/seed.sql:/docker-entrypoint-initdb.d/03-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  api:
    build: .
    env_file: .env
    environment:
      PYTHONPATH: /app
    volumes:
      - .:/app
      - ./data:/app/data
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_started
      redis:
        condition: service_started
    restart: unless-stopped

  # Service d'initialisation des données (une seule fois)
  init:
    build: .
    command: bash /app/scripts/init_all.sh
    env_file: .env
    environment:
      PYTHONPATH: /app
    volumes:
      - .:/app
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_started
    restart: "no"

  scheduler:
    build: .
    command: python -m src.batch.nightly_jobs
    env_file: .env
    environment:
      PYTHONPATH: /app
    volumes:
      - .:/app
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  fraud-consumer:
    build: .
    command: python -m src.streaming.consumer
    env_file: .env
    environment:
      PYTHONPATH: /app
    volumes:
      - .:/app
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped


  simulator:
    build: .
    command: python -m scripts.simulate_live
    env_file: .env
    environment:
      API_URL: http://api:8000
      SIM_INTERVAL: "3"
      SIM_SUSPECT_RATIO: "0.2"
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres_data:
  mongo_data:
  redis_data:
