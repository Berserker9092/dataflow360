name: CI/CD Pipeline - DataFlow360

on:
  push:
    branches: [ "main", "feature/*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt || pip install pytest polars pandas xgboost joblib fastapi uvicorn pydantic psycopg2-binary
        
    - name: Run unit tests with pytest
      env:
        PYTHONPATH: .
      run: |
        pytest tests/ -v
